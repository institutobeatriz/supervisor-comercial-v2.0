# ============================================================
# SUPERVISOR COMERCIAL - Docker Compose
# ============================================================
# Modo A (tudo em Docker): docker compose --profile all-in-docker up -d
# Modo B (infra only):     docker compose --profile infra-only up -d
# ============================================================

services:
  # ==========================================================
  # POSTGRESQL 16 + pgvector
  # ==========================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: supervisor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: sales_supervisor
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/migrations:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d sales_supervisor"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - all-in-docker
      - infra-only

  # ==========================================================
  # REDIS (BullMQ)
  # ==========================================================
  redis:
    image: redis:7-alpine
    container_name: supervisor-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - all-in-docker
      - infra-only

  # ==========================================================
  # API (Fastify)
  # ==========================================================
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.api
    container_name: supervisor-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://app:app@postgres:5432/sales_supervisor
      REDIS_URL: redis://redis:6379
      PORT: 3000
      AUDIT_LOG_DIR: /app/logs
    volumes:
      - ./logs:/app/logs
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - all-in-docker

  # ==========================================================
  # WORKER (BullMQ)
  # ==========================================================
  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.worker
    container_name: supervisor-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://app:app@postgres:5432/sales_supervisor
      REDIS_URL: redis://redis:6379
      AUDIT_LOG_DIR: /app/logs
      WORKER_HEALTH_PORT: 3002
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - all-in-docker

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: supervisor-network
