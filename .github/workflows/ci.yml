name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  quality-and-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: sales_supervisor
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d sales_supervisor"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: production
      PORT: 3000
      API_HOST: 127.0.0.1
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/sales_supervisor
      REDIS_URL: redis://127.0.0.1:6379
      ADMIN_API_KEY: ci-admin-key
      AUDIT_LOG_DIR: ./logs
      CI_API_URL: http://127.0.0.1:3000
      MONITOR_STATE_FILE: ./logs/monitoring/ci-slo-state.json
      MONITOR_REPORT_FILE: ./logs/monitoring/ci-last-report.json
      MONITOR_INCIDENTS_FILE: ./logs/monitoring/ci-incidents.json
      RELIABILITY_REPORT_FILE: ./logs/monitoring/ci-reliability-summary.json
      RELIABILITY_DASHBOARD_FILE: ./logs/monitoring/ci-reliability-dashboard.md
      POSTMORTEM_OUTPUT_DIR: ./logs/monitoring/ci-postmortems
