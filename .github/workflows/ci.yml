      ONCALL_DASHBOARD_FILE: ./logs/monitoring/ci-oncall-dashboard.md
      ONCALL_EXECUTIVE_REPORT_FILE: ./logs/monitoring/ci-executive-sla-report.json
      ONCALL_AUDIT_FILE: ./logs/monitoring/ci-executive-audit-trail.jsonl
