      FULLCYCLE_CONNECTOR_OBS_LIVE_GOVERNANCE_DASHBOARD_FILE: ./logs/monitoring/ci-observability-live-governance.md
      FULLCYCLE_CONNECTOR_OBS_LIVE_GOVERNANCE_AUDIT_FILE: ./logs/monitoring/ci-observability-live-governance-audit.jsonl
      FULLCYCLE_CONNECTOR_OBS_LIVE_RUNTIME_PROFILE: "ci"
      FULLCYCLE_CONNECTOR_OBS_LIVE_API_HOST: 127.0.0.1
      FULLCYCLE_CONNECTOR_OBS_LIVE_API_PORT: 3100
      FULLCYCLE_CONNECTOR_OBS_LIVE_ADMIN_API_KEY: ci-admin-key
      FULLCYCLE_CONNECTOR_OBS_LIVE_BOOT_DOCKER_INFRA: "false"
