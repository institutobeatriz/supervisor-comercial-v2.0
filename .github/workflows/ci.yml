      FULLCYCLE_CONNECTOR_OBS_LIVE_REDIS_URL: redis://127.0.0.1:6379
      FULLCYCLE_CONNECTOR_OBS_LIVE_BROWSER_ARGS: --no-sandbox,--disable-dev-shm-usage

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Connector adapters drill (phase20)
        run: npm run test:phase20

      - name: Connector runtime drill (phase21)
        run: npm run test:phase21

      - name: Connector readiness drill (phase22)
        run: npm run test:phase22

      - name: Connector consolidation drill (phase23)
        run: npm run test:phase23

      - name: Connector observability drill (phase24)
        run: npm run test:phase24

      - name: Connector productization drill (phase25)
        run: npm run test:phase25

      - name: Connector observability API governance drill (phase26)
        run: npm run test:phase26

      - name: Connector observability realtime drill (phase27)
        run: npm run test:phase27

      - name: Connector observability realtime alerting drill (phase28)
        run: npm run test:phase28

      - name: Connector observability realtime panel drill (phase29)
        run: npm run test:phase29

      - name: Connector observability backend consolidation drill (phase30)
        run: npm run test:phase30

      - name: Connector observability backend-first panel drill (phase31)
        run: npm run test:phase31

      - name: Connector observability backend on-call analytics drill (phase32)
        run: npm run test:phase32

      - name: Connector observability operational on-call drill (phase39)
        run: npm run test:phase39

      - name: Connector observability operational source health drill (phase40)
        run: npm run test:phase40

      - name: Connector observability operational provider contract drill (phase41)
        run: npm run test:phase41

      - name: Connector observability operational producer drill (phase42)
        run: npm run test:phase42

      - name: Connector observability legacy convergence drill (phase35)
        env:
          FULLCYCLE_CONNECTOR_OBS_BACKEND_REQUIRE_INCIDENTS: "false"
          FULLCYCLE_CONNECTOR_OBS_BACKEND_REQUIRE_ALERT_REPORT: "false"
          FULLCYCLE_CONNECTOR_OBS_BACKEND_REQUIRE_API_SLA_HISTORY: "false"
        run: npm run test:phase35

      - name: Connector observability CSP hardening drill (phase38)
        run: npm run test:phase38

      - name: Connector observability live governance gate (phase34)
        run: npm run test:phase34

      - name: Materialize observability realtime panel shell
        env:
          FULLCYCLE_CONNECTOR_OBS_PANEL_ENFORCE_TARGETS: "false"
          FULLCYCLE_CONNECTOR_OBS_PANEL_REQUIRE_STREAM_PASS: "false"
          FULLCYCLE_CONNECTOR_OBS_PANEL_REQUIRE_ALERTING_PASS: "false"
          FULLCYCLE_CONNECTOR_OBS_PANEL_REQUIRE_API_SLA_HISTORY: "false"
          FULLCYCLE_CONNECTOR_OBS_PANEL_REQUIRE_BACKEND_STORE: "false"
          FULLCYCLE_CONNECTOR_OBS_PANEL_REQUIRE_BACKEND_PASS: "false"
          FULLCYCLE_CONNECTOR_OBS_PANEL_REQUIRE_TEAM_ROUTING: "false"
          FULLCYCLE_CONNECTOR_OBS_PANEL_MIN_TEAMS: "0"
        run: npm run monitor:fullcycle:observability:panel

      - name: Start API
        run: |
          node apps/api/dist/index.js > ci-api.log 2>&1 &
          echo $! > ci-api.pid

      - name: Wait for health
        run: |
          for i in {1..60}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:3000/health || true)
            if [ "$code" = "200" ]; then
              echo "API healthy"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"
          cat ci-api.log || true
          exit 1

      - name: API smoke checks
        run: npm run test:ci:api-smoke

      - name: Monitoring check (CI gate)
        env:
          MONITOR_DOCKER_WORKER_CHECK: "false"
          MONITOR_EXIT_ON_INCIDENT: "true"
        run: npm run monitor:check

      - name: Reliability targets gate
        env:
          RELIABILITY_ENFORCE_TARGETS: "true"
          RELIABILITY_TARGET_MTTR_MIN: "180"
          RELIABILITY_TARGET_MTTD_SEC: "600"
          RELIABILITY_MAX_OPEN_INCIDENTS: "0"
        run: npm run monitor:reliability

      - name: Build reliability dashboard
        run: npm run monitor:dashboard

      - name: Postmortem automation snapshot
        run: npm run monitor:postmortem

      - name: ITSM/paging automation snapshot
        run: npm run monitor:itsm

      - name: Enterprise governance gate
        env:
          ONCALL_OWNER_DYNAMIC_ENABLED: "true"
          ONCALL_OWNER_PRESERVE_MANUAL: "true"
          ITSM_RECONCILIATION_ENABLED: "true"
          ITSM_RECONCILIATION_ALLOW_MISSING_SNAPSHOT: "true"
          ITSM_RECONCILIATION_FAIL_ON_DRIFT: "false"
          SLO_EXECUTIVE_ENFORCE_TARGETS: "true"
          SLO_EXEC_MAX_OPEN_INCIDENTS: "0"
        run: npm run monitor:governance

      - name: Full-cycle governance gate
        env:
          FULLCYCLE_APPLY_LOCAL_BACKFILL: "false"
          FULLCYCLE_ENFORCE_TARGETS: "true"
          FULLCYCLE_REQUIRE_GOVERNANCE_PASS: "true"
          FULLCYCLE_MAX_PENDING_ACTIONS: "20"
          FULLCYCLE_MAX_ORPHAN_EXTERNALS: "0"
          FULLCYCLE_MIN_OWNER_COVERAGE_PCT: "95"
        run: npm run monitor:fullcycle

      - name: Full-cycle execution gate
        env:
          FULLCYCLE_EXEC_DRY_RUN: "true"
          FULLCYCLE_EXEC_REQUIRE_ENDPOINTS: "false"
          FULLCYCLE_EXEC_FAIL_ON_ERROR: "false"
          FULLCYCLE_EXEC_FAIL_ON_BLOCKING_ERROR: "true"
          FULLCYCLE_EXEC_REPLAY_SUCCESS: "false"
          FULLCYCLE_EXEC_REPLAY_APPLIED: "false"
        run: npm run monitor:fullcycle:execute

      - name: Full-cycle convergence gate
        env:
          FULLCYCLE_LOOP_MAX_CYCLES: "2"
          FULLCYCLE_LOOP_ENFORCE_TARGETS: "true"
          FULLCYCLE_LOOP_REQUIRE_IMPROVEMENT: "false"
          FULLCYCLE_LOOP_REQUIRE_ZERO_BLOCKING: "true"
          FULLCYCLE_LOOP_PATCH_SNAPSHOT: "true"
          FULLCYCLE_EXEC_DRY_RUN: "true"
          FULLCYCLE_EXEC_REQUIRE_ENDPOINTS: "false"
          FULLCYCLE_EXEC_FAIL_ON_ERROR: "false"
          FULLCYCLE_EXEC_FAIL_ON_BLOCKING_ERROR: "true"
        run: npm run monitor:fullcycle:loop

      - name: Connector runtime gate
        run: npm run monitor:fullcycle:connectors

      - name: Connector readiness gate
        run: npm run monitor:fullcycle:readiness

      - name: Connector consolidation gate
        run: npm run monitor:fullcycle:consolidation

      - name: Connector observability gate
        run: npm run monitor:fullcycle:observability

      - name: Connector productization gate
        run: npm run monitor:fullcycle:productization

      - name: Connector observability API governance gate
        run: npm run monitor:fullcycle:observability:api

      - name: Connector observability realtime gate
        run: npm run monitor:fullcycle:observability:realtime

      - name: Connector observability realtime alerting gate
        run: npm run monitor:fullcycle:observability:alerting

      - name: Connector observability backend operational producer gate
        env:
          FULLCYCLE_CONNECTOR_OBS_BACKEND_REQUIRE_INCIDENTS: "false"
          FULLCYCLE_CONNECTOR_OBS_BACKEND_REQUIRE_ALERT_REPORT: "false"
          FULLCYCLE_CONNECTOR_OBS_BACKEND_REQUIRE_API_SLA_HISTORY: "false"
        run: npm run monitor:fullcycle:observability:backend

      - name: Connector observability backend-first panel gate
        env:
          FULLCYCLE_CONNECTOR_OBS_PANEL_MIN_TEAMS: "0"
        run: npm run monitor:fullcycle:observability:panel

      - name: On-call executive dashboard snapshot
        run: npm run monitor:oncall

      - name: Stop API
        if: always()
        run: |
          if [ -f ci-api.pid ]; then
            kill "$(cat ci-api.pid)" || true
          fi

      - name: Upload reliability artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reliability-artifacts
          path: |
            logs/monitoring/ci-*.json
            logs/monitoring/ci-*.md
            logs/monitoring/ci-*.html
            logs/monitoring/ci-*.jsonl
            logs/monitoring/ci-phase34-live/**
            logs/monitoring/ci-connector-postmortems/**
            logs/monitoring/ci-postmortems/**
          if-no-files-found: warn

      - name: Show API log on failure
        if: failure()
        run: cat ci-api.log || true
